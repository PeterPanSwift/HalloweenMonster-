name: HalloweenMonster
options:
  bundleIdPrefix: com.peterpanswift
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HalloweenMonster:
    type: application
    platform: iOS
    sources: [HalloweenMonster]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peterpanswift.HalloweenMonster
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 怪物召喚
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  HalloweenMonsterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HalloweenMonsterUITests]
    dependencies:
      - target: HalloweenMonster
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peterpanswift.HalloweenMonsterUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HalloweenMonster
schemes:
  HalloweenMonster:
    build:
      targets:
        HalloweenMonster: all
        HalloweenMonsterUITests: [test]
    test:
      targets:
        - HalloweenMonsterUITests
