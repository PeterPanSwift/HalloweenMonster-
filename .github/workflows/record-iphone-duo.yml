name: Record iPhone Duo demo

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore:
      - "recordings/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      xcode-version:
        description: Xcode version under /Applications (Xcode_<version>.app)
        default: "27.1"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Build, test and record on iPhone Duo
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.1
        run: scripts/ci_select_xcode.sh
        env:
          XCODE_VERSION: ${{ inputs.xcode-version || '27.1' }}

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Create and boot iPhone Duo simulator
        run: scripts/ci_prepare_simulator.sh

      - name: Build app and UI tests
        run: |
          xcodebuild build-for-testing \
            -project HalloweenMonster.xcodeproj \
            -scheme HalloweenMonster \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build

      - name: Record demo video
        run: scripts/record_demo.sh "$SIM_UDID" out

      - name: Compress recording to MP4
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg
          # The raw simulator capture is ~150 MB; GitHub rejects files over 100 MB.
          # Also cut the idle home screen before the app appears.
          trim=$(cat out/trim_start_seconds 2>/dev/null || echo 0)
          ffmpeg -hide_banner -loglevel warning -y -ss "$trim" -i out/iphone-duo-demo.mov \
            -vf "fps=30,scale=720:-2" -c:v libx264 -preset slow -crf 26 \
            -pix_fmt yuv420p -movflags +faststart -an out/iphone-duo-demo.mp4
          ls -lh out/iphone-duo-demo.mov out/iphone-duo-demo.mp4

      - name: Upload recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-duo-demo
          path: |
            out/*.mov
            out/*.mp4
            out/displays.txt
            out/recordVideo.log
          if-no-files-found: warn

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: out/UITests.xcresult

      - name: Commit recording to branch
        if: success()
        run: |
          mkdir -p recordings
          size=$(stat -f%z out/iphone-duo-demo.mp4)
          if (( size < 100000 || size > 95000000 )); then
            echo "::error::Compressed recording is $size bytes; not committing it"
            exit 1
          fi
          cp out/iphone-duo-demo.mp4 recordings/iphone-duo-demo.mp4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recordings/iphone-duo-demo.mp4
          git commit -m "Add iPhone Duo demo recording from run ${{ github.run_id }}" || exit 0
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
